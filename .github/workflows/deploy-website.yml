name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "website/**"

jobs:
  deploy:
    runs-on: [self-hosted, homelab]

    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          HUGO_VERSION=0.161.1
          if ! hugo version 2>/dev/null | grep -q "${HUGO_VERSION}"; then
            curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin hugo
          fi

      - name: Build site
        run: cd website && hugo --minify

      - name: Copy to serve directory
        run: |
          rsync -a --delete website/public/ /opt/monitoring/homelab-site/build/html/

      - name: Rebuild container
        run: |
          docker compose -f /opt/monitoring/docker-compose.yml up -d --build homelab-site
