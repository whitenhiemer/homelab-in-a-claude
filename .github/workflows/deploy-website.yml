name: Deploy website

on:
  push:
    branches: [master]
    paths:
      - "website/**"

jobs:
  deploy:
    runs-on: [self-hosted, homelab]

    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: cd website && hugo --minify

      - name: Copy to serve directory
        run: |
          rsync -a --delete website/public/ /opt/monitoring/homelab-site/build/html/

      - name: Rebuild container
        run: |
          docker compose -f /opt/monitoring/docker-compose.yml up -d --build homelab-site
