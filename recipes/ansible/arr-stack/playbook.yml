---
# Deploy the ARR media management stack via Docker Compose.
# Includes Prowlarr, Sonarr, Radarr, Bazarr, Overseerr, SABnzbd behind gluetun VPN.
#
# Variables (pass via --extra-vars):
#   wg_private_key     WireGuard private key for VPN provider (required)
#   wg_public_key      WireGuard server public key (required)
#   wg_address         WireGuard client address (required, e.g., 100.64.48.200/32)
#   wg_endpoint_ip     WireGuard server IP (required)
#   wg_endpoint_port   WireGuard server port (default: 51820)
#   nfs_server         TrueNAS NFS server IP (optional, for media mounts)
#   nfs_share          NFS export path (optional, e.g., /mnt/pool/media)

- name: Deploy ARR media stack
  hosts: arr
  vars:
    arr_uid: 1000
    arr_gid: 1000
    arr_base_dir: /opt/arr
    wg_private_key: ""
    wg_public_key: ""
    wg_address: ""
    wg_endpoint_ip: ""
    wg_endpoint_port: "51820"
    nfs_server: ""
    nfs_share: ""
    media_mount: /media

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, nfs-common]
        state: present

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set Docker GPG key permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker repository
      ansible.builtin.copy:
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"

    - name: Install Docker CE
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Create directory structure
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ arr_uid }}"
        group: "{{ arr_gid }}"
        mode: "0755"
      loop:
        - "{{ arr_base_dir }}/prowlarr/config"
        - "{{ arr_base_dir }}/sonarr/config"
        - "{{ arr_base_dir }}/radarr/config"
        - "{{ arr_base_dir }}/bazarr/config"
        - "{{ arr_base_dir }}/overseerr/config"
        - "{{ arr_base_dir }}/sabnzbd/config"
        - "{{ arr_base_dir }}/gluetun"

    - name: Write WireGuard private key file
      ansible.builtin.copy:
        content: "{{ wg_private_key }}"
        dest: "{{ arr_base_dir }}/gluetun/wireguard_private_key"
        owner: root
        group: root
        mode: "0600"
      when: wg_private_key != ""
      no_log: true

    - name: Mount NFS media share
      ansible.posix.mount:
        path: "{{ media_mount }}"
        src: "{{ nfs_server }}:{{ nfs_share }}"
        fstype: nfs
        opts: "rw,hard,intr,rsize=131072,wsize=131072"
        state: mounted
      when: nfs_server != "" and nfs_share != ""

    - name: Deploy docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ arr_base_dir }}/docker-compose.yml"
        owner: "{{ arr_uid }}"
        group: "{{ arr_gid }}"
        mode: "0644"
      notify: Restart ARR stack

    - name: Start ARR stack
      ansible.builtin.shell:
        cmd: docker compose -f {{ arr_base_dir }}/docker-compose.yml up -d
        chdir: "{{ arr_base_dir }}"
      changed_when: false

  handlers:
    - name: Restart ARR stack
      ansible.builtin.shell:
        cmd: docker compose -f {{ arr_base_dir }}/docker-compose.yml up -d --force-recreate
        chdir: "{{ arr_base_dir }}"
